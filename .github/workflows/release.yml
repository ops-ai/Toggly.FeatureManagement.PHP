name: PHP SDK - Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          # Root composer.json IS the publishable core package (Packagist URL).
          manifest_path: composer.json
          registry: packagist
          package_name: toggly/feature-management-php
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: xdebug

      - name: Validate composer.json
        # --no-check-version: manifests keep a version field for release resolution.
        # --no-check-lock: root composer.lock is gitignored (workspace regenerates it).
        run: |
          composer validate --strict --no-check-version --no-check-lock
          composer validate --strict --no-check-version packages/laravel/composer.json
          composer validate --strict --no-check-version packages/wordpress/composer.json

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --prefer-stable

      - name: Run tests
        run: vendor/bin/phpunit
        continue-on-error: true

  release:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Prefer a PAT that can push tags + cross-repo mirror splits.
          # GITHUB_TOKEN cannot push to sibling repos; RELEASE_PUSH_TOKEN must
          # have `repo` scope on ops-ai/Toggly.FeatureManagement.PHP.Laravel and
          # ops-ai/Toggly.FeatureManagement.PHP.Wordpress (human gate).
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      # secrets.* cannot be used directly in `if:` — detect via env in a step.
      - name: Detect GPG secrets
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        id: import_gpg
        if: steps.gpg.outputs.available == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            git config user.name "${{ steps.import_gpg.outputs.name }}"
            git config user.email "${{ steps.import_gpg.outputs.email }}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "GPG secrets not configured — tags will be unsigned (Packagist still accepts GitHub tags)."
          fi

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const root = JSON.parse(fs.readFileSync('composer.json', 'utf8'));
          root.version = version;
          if (root['require-dev']) {
            if (root['require-dev']['toggly/laravel']) root['require-dev']['toggly/laravel'] = version;
            if (root['require-dev']['toggly/wordpress']) root['require-dev']['toggly/wordpress'] = version;
          }
          fs.writeFileSync('composer.json', JSON.stringify(root, null, 4) + '\n');
          for (const rel of ['packages/laravel/composer.json', 'packages/wordpress/composer.json']) {
            const json = JSON.parse(fs.readFileSync(rel, 'utf8'));
            json.version = version;
            if (json.require && json.require['toggly/feature-management-php']) {
              const [maj] = version.split('.');
              json.require['toggly/feature-management-php'] = `^${maj}.0`;
            }
            fs.writeFileSync(rel, JSON.stringify(json, null, 4) + '\n');
          }
          let sdk = fs.readFileSync('src/SdkIdentity.php', 'utf8');
          sdk = sdk.replace(
            /public const SDK_VERSION = '[^']+';/,
            `public const SDK_VERSION = '${version}';`
          );
          fs.writeFileSync('src/SdkIdentity.php', sdk);
          NODE

          git add composer.json packages/laravel/composer.json packages/wordpress/composer.json src/SdkIdentity.php
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            git commit -S -m "Bumped PHP SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"
          else
            git commit -m "Bumped PHP SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"
          fi

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin main; then
              if git push origin main; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          TAG="v${{ needs.validate.outputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping create"
          else
            if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
              git tag -s -m "$TAG" "$TAG"
            else
              git tag -a -m "$TAG" "$TAG"
            fi
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          body: |
            ## PHP SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            # Core only
            composer require toggly/feature-management-php

            # Laravel (pulls core)
            composer require toggly/laravel

            # WordPress (pulls core)
            composer require toggly/wordpress
            ```

            ### Breaking (1.0+)

            Laravel and WordPress integrations ship as separate Packagist packages.
            Core no longer includes `Toggly\Laravel` / `Toggly\WordPress` classes.

            ### Requirements

            - PHP ^7.4 | ^8.0 | ^8.1 | ^8.2 | ^8.3 | ^8.4

            ### Links

            - [Packagist core](https://packagist.org/packages/toggly/feature-management-php)
            - [Packagist Laravel](https://packagist.org/packages/toggly/laravel)
            - [Packagist WordPress](https://packagist.org/packages/toggly/wordpress)
            - [Documentation](https://docs.toggly.io/sdks/php)
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  split-mirrors:
    needs: [release, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: laravel
            repository_name: Toggly.FeatureManagement.PHP.Laravel
          - local_path: wordpress
            repository_name: Toggly.FeatureManagement.PHP.Wordpress
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v${{ needs.validate.outputs.version }}
          # Cross-repo push requires RELEASE_PUSH_TOKEN (PAT with repo scope on
          # both mirror repos). github.token alone cannot push to siblings.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Require RELEASE_PUSH_TOKEN for mirror push
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "${RELEASE_PUSH_TOKEN}" ]; then
            echo "::error::RELEASE_PUSH_TOKEN is required to push subtree splits to mirror repos (GITHUB_TOKEN cannot push cross-repo)."
            echo "Human gate: create/update a PAT with repo scope for ops-ai/Toggly.FeatureManagement.PHP.Laravel and ops-ai/Toggly.FeatureManagement.PHP.Wordpress, store as RELEASE_PUSH_TOKEN."
            exit 1
          fi

      - name: Split package directory to mirror
        uses: danharrin/monorepo-split-github-action@v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        with:
          package_directory: packages/${{ matrix.package.local_path }}
          repository_organization: ops-ai
          repository_name: ${{ matrix.package.repository_name }}
          branch: main
          tag: v${{ needs.validate.outputs.version }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

  summary:
    needs: [release, split-mirrors, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## PHP SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core package | toggly/feature-management-php (repo root) |" >> $GITHUB_STEP_SUMMARY
          echo "| Laravel mirror | ops-ai/Toggly.FeatureManagement.PHP.Laravel |" >> $GITHUB_STEP_SUMMARY
          echo "| WordPress mirror | ops-ai/Toggly.FeatureManagement.PHP.Wordpress |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Packagist auto-updates from GitHub tags via webhook on each package repo." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Core on Packagist](https://packagist.org/packages/toggly/feature-management-php)" >> $GITHUB_STEP_SUMMARY
