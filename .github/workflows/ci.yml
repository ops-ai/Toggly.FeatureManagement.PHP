name: PHP SDK - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, mongodb

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-
            ${{ runner.os }}-composer-

      - name: Validate package composer.json files
        # Root composer.json IS the publishable core package (Packagist).
        # --no-check-version: manifests keep a version field for release resolution.
        # --no-check-lock: root composer.lock is gitignored (workspace regenerates it).
        run: |
          composer validate --strict --no-check-version --no-check-lock
          composer validate --strict --no-check-version packages/laravel/composer.json
          composer validate --strict --no-check-version packages/wordpress/composer.json

      - name: Install dependencies (path repos)
        run: composer update --prefer-dist --no-progress --no-interaction --prefer-stable

      - name: Check code style
        run: |
          if [ -f "vendor/bin/phpcs" ]; then
            vendor/bin/phpcs --standard=PSR12 packages/*/src/ || echo "Code style check completed with warnings"
          else
            echo "PHP_CodeSniffer not installed, skipping code style check"
          fi
        continue-on-error: true

      - name: Run PHPUnit tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --log-junit=test-results.xml --coverage-text

      - name: Upload coverage (PHP 8.3 only)
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: |
            coverage.xml
            test-results.xml
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-php-${{ matrix.php-version }}
          path: "*.xml"
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, openssl, curl

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --prefer-stable

      - name: Run smoke tests
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: vendor/bin/phpunit --filter SmokeTest

  laravel-hosts:
    name: Laravel ${{ matrix.laravel-version }} on PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel-version: '10.3.3'
            php-version: '8.2'
          - laravel-version: '11.6.1'
            php-version: '8.3'
          - laravel-version: '12.12.2'
            php-version: '8.5'
          - laravel-version: '13.10.1'
            php-version: '8.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, openssl, curl

      - name: Build candidate Composer archives
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          mkdir -p "$artifacts"
          composer archive --format=tar --dir="$artifacts" --file=feature-management-php
          composer --working-dir=packages/laravel archive --format=tar --dir="$artifacts" --file=laravel

      - name: Install the packed Laravel package into a real host
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          host="$RUNNER_TEMP/laravel-${{ matrix.laravel-version }}"
          # Composer policy is project-local. Materialize the retained Laravel
          # 10/11 host without resolving it, then write only that temporary
          # fixture's documented advisory acknowledgements before installation.
          composer create-project --no-install --no-scripts --no-interaction --prefer-dist \
            laravel/laravel "$host" "v${{ matrix.laravel-version }}"
          php tests/HostFixtures/configure-laravel-policy.php "$host" "${{ matrix.laravel-version }}"
          composer --working-dir="$host" install --no-interaction --prefer-dist --no-progress
          composer --working-dir="$host" config repositories.toggly artifact "$artifacts"
          laravel_package_version=$(php -r '$manifest = json_decode(file_get_contents("packages/laravel/composer.json"), true, 512, JSON_THROW_ON_ERROR); echo $manifest["version"];')
          composer --working-dir="$host" require --no-interaction --no-progress \
            "toggly/laravel:${laravel_package_version}"
          php tests/HostFixtures/laravel-bootstrap.php "$host"

  wordpress-host:
    name: WordPress 7.1 on PHP 8.5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2, wp-cli
          extensions: mbstring, xml, ctype, json, openssl, curl, mysqli

      - name: Build candidate Composer archives
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          mkdir -p "$artifacts"
          composer archive --format=tar --dir="$artifacts" --file=feature-management-php
          composer --working-dir=packages/wordpress archive --format=tar --dir="$artifacts" --file=wordpress

      - name: Install and activate the packed plugin in WordPress
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          wordpress="$RUNNER_TEMP/wordpress"
          wp core download --path="$wordpress" --version=7.1 --skip-content
          wp config create --path="$wordpress" --dbname=wordpress --dbuser=root \
            --dbpass=root --dbhost=127.0.0.1 --skip-check
          for attempt in {1..30}; do
            if php -r 'mysqli_report(MYSQLI_REPORT_OFF); $connection = @mysqli_connect("127.0.0.1", "root", "root", "wordpress"); if ($connection === false) { exit(1); } mysqli_close($connection);'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MySQL did not become ready for the WordPress fixture." >&2
              exit 1
            fi
            sleep 2
          done
          wp core install --path="$wordpress" --url=http://localhost \
            --title='Toggly WordPress Host' --admin_user=admin \
            --admin_password=not-a-production-password --admin_email=admin@example.invalid
          plugin="$wordpress/wp-content/plugins/toggly"
          mkdir -p "$plugin"
          tar -xf "$artifacts/wordpress.tar" -C "$plugin"
          composer --working-dir="$plugin" config repositories.toggly artifact "$artifacts"
          composer --working-dir="$plugin" install --no-interaction --prefer-dist --no-progress
          wp plugin activate toggly --path="$wordpress"
          wp eval --path="$wordpress" '
            if (!function_exists("toggly_is_enabled")) { throw new RuntimeException("Toggly plugin did not initialize."); }
            if (toggly_is_enabled("missing-feature") !== false) { throw new RuntimeException("Unexpected evaluation result."); }
            if (!wp_next_scheduled("toggly_refresh_features")) { throw new RuntimeException("Refresh cron was not scheduled."); }
            if (!wp_next_scheduled("toggly_send_stats")) { throw new RuntimeException("Telemetry cron was not scheduled."); }
            echo "Toggly WordPress plugin activation passed.\\n";
          '

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: php-coverage
          path: coverage/
        continue-on-error: true

      - name: List coverage files
        run: |
          echo "Coverage files:"
          find coverage -type f || echo "No coverage files found"

      - name: Normalize paths in test results
        run: |
          if [ -f "coverage/test-results.xml" ]; then
            sed -i "s|${GITHUB_WORKSPACE}/||g" coverage/test-results.xml
            echo "Paths normalized in test-results.xml"
          else
            echo "test-results.xml not found, skipping normalization"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-php
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - PHP"
            -Dsonar.sources=src,packages
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/vendor/**
            -Dsonar.php.coverage.reportPaths=coverage/coverage.xml
            -Dsonar.php.tests.reportPath=coverage/test-results.xml
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-php
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-php
            -Dsonar.projectName="Toggly SDKs - PHP"
            -Dsonar.sources=src,packages
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/vendor/**
            -Dsonar.php.coverage.reportPaths=coverage/coverage.xml
            -Dsonar.php.tests.reportPath=coverage/test-results.xml
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-php'
          path: '.'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-php
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-test, laravel-hosts, wordpress-host, sonar, dependency-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## PHP SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PHP Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.2" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.3" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.4" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current framework hosts" >> $GITHUB_STEP_SUMMARY
          echo "- Laravel 10.3.3, 11.6.1, 12.12.2, and 13.10.1 from packed artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- WordPress 7.1 plugin activation from a packed artifact on PHP 8.5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Tested" >> $GITHUB_STEP_SUMMARY
          echo "- toggly/feature-management-php (core at repo root)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly/laravel (packages/laravel → mirror)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly/wordpress (packages/wordpress → mirror)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-php" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-php" >> $GITHUB_STEP_SUMMARY
