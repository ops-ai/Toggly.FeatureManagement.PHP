name: PHP SDK - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
  schedule:
    # 07:00 UTC (02:00 America/Chicago). Scheduled workflows run from main.
    - cron: '0 7 * * *'

jobs:
  commits-since-last-run:
    name: Check for commits since last run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare main with the previous run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          last=$(gh run list \
            --workflow=ci.yml \
            --branch=main \
            --limit=30 \
            --json databaseId,headSha \
            --jq "map(select(.databaseId != ${GITHUB_RUN_ID}))[0].headSha")
          if [ -z "${last}" ] || [ "${last}" = "null" ] || [ "${last}" != "${current}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "main ${current} differs from the previous run (${last:-none})."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "main ${current} matches the previous run. Skipping analysis."
          fi

  test:
    name: Test PHP ${{ matrix.php-version }}
    needs: [commits-since-last-run]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.commits-since-last-run.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, mongodb

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-
            ${{ runner.os }}-composer-

      - name: Validate package composer.json files
        # Root composer.json IS the publishable core package (Packagist).
        # --no-check-version: manifests keep a version field for release resolution.
        # --no-check-lock: root composer.lock is gitignored (workspace regenerates it).
        run: |
          composer validate --strict --no-check-version --no-check-lock
          composer validate --strict --no-check-version packages/laravel/composer.json
          composer validate --strict --no-check-version packages/wordpress/composer.json

      - name: Install dependencies (path repos)
        run: composer update --prefer-dist --no-progress --no-interaction --prefer-stable

      - name: Check code style
        run: |
          if [ -f "vendor/bin/phpcs" ]; then
            vendor/bin/phpcs --standard=PSR12 packages/*/src/ || echo "Code style check completed with warnings"
          else
            echo "PHP_CodeSniffer not installed, skipping code style check"
          fi
        continue-on-error: true

      - name: Run PHPUnit tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --log-junit=test-results.xml --coverage-text

      - name: Upload coverage (PHP 8.3 only)
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: |
            coverage.xml
            test-results.xml
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-php-${{ matrix.php-version }}
          path: "*.xml"
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test
    needs: [commits-since-last-run]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.commits-since-last-run.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, openssl, curl

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --prefer-stable

      - name: Run smoke tests
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: vendor/bin/phpunit --filter SmokeTest

  laravel-hosts:
    name: Laravel ${{ matrix.laravel-version }} on PHP ${{ matrix.php-version }}
    needs: [commits-since-last-run]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.commits-since-last-run.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel-version: '10.3.3'
            php-version: '8.2'
          - laravel-version: '11.6.1'
            php-version: '8.3'
          - laravel-version: '12.12.2'
            php-version: '8.5'
          - laravel-version: '13.10.1'
            php-version: '8.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, openssl, curl

      - name: Build candidate Composer archives
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          mkdir -p "$artifacts"
          composer archive --format=tar --dir="$artifacts" --file=feature-management-php
          composer --working-dir=packages/laravel archive --format=tar --dir="$artifacts" --file=laravel

      - name: Install the packed Laravel package into a real host
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          host="$RUNNER_TEMP/laravel-${{ matrix.laravel-version }}"
          # Composer policy is project-local. Materialize the retained Laravel
          # 10/11 host without resolving it, then write only that temporary
          # fixture's documented advisory acknowledgements before installation.
          composer create-project --no-install --no-scripts --no-interaction --prefer-dist \
            laravel/laravel "$host" "v${{ matrix.laravel-version }}"
          php tests/HostFixtures/configure-laravel-policy.php "$host" "${{ matrix.laravel-version }}"
          composer --working-dir="$host" install --no-interaction --prefer-dist --no-progress
          composer --working-dir="$host" config repositories.toggly artifact "$artifacts"
          laravel_package_version=$(php -r '$manifest = json_decode(file_get_contents("packages/laravel/composer.json"), true, 512, JSON_THROW_ON_ERROR); echo $manifest["version"];')
          composer --working-dir="$host" require --no-interaction --no-progress \
            "toggly/laravel:${laravel_package_version}"
          php tests/HostFixtures/laravel-bootstrap.php "$host"

  wordpress-host:
    name: WordPress 7.1 on PHP 8.5
    needs: [commits-since-last-run]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.commits-since-last-run.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2, wp-cli
          extensions: mbstring, xml, ctype, json, openssl, curl, mysqli

      - name: Ensure wp-cli is on PATH
        run: |
          set -euo pipefail
          if command -v wp >/dev/null 2>&1; then
            wp --info
            exit 0
          fi
          echo "setup-php did not install wp-cli; installing phar fallback"
          curl -fsSL -o "$RUNNER_TEMP/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$RUNNER_TEMP/wp-cli.phar"
          sudo mv "$RUNNER_TEMP/wp-cli.phar" /usr/local/bin/wp
          wp --info

      - name: Build candidate Composer archives
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          mkdir -p "$artifacts"
          composer archive --format=tar --dir="$artifacts" --file=feature-management-php
          composer --working-dir=packages/wordpress archive --format=tar --dir="$artifacts" --file=wordpress

      - name: Install and activate the packed plugin in WordPress
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/toggly-php-artifacts"
          wordpress="$RUNNER_TEMP/wordpress"
          wp core download --path="$wordpress" --version=7.1 --skip-content
          wp config create --path="$wordpress" --dbname=wordpress --dbuser=root \
            --dbpass=root --dbhost=127.0.0.1 --skip-check
          for attempt in {1..30}; do
            if php -r 'mysqli_report(MYSQLI_REPORT_OFF); $connection = @mysqli_connect("127.0.0.1", "root", "root", "wordpress"); if ($connection === false) { exit(1); } mysqli_close($connection);'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MySQL did not become ready for the WordPress fixture." >&2
              exit 1
            fi
            sleep 2
          done
          wp core install --path="$wordpress" --url=http://localhost \
            --title='Toggly WordPress Host' --admin_user=admin \
            --admin_password=not-a-production-password --admin_email=admin@example.invalid
          plugin="$wordpress/wp-content/plugins/toggly"
          mkdir -p "$plugin"
          tar -xf "$artifacts/wordpress.tar" -C "$plugin"
          composer --working-dir="$plugin" config repositories.toggly artifact "$artifacts"
          composer --working-dir="$plugin" install --no-interaction --prefer-dist --no-progress
          wp plugin activate toggly --path="$wordpress"
          wp eval --path="$wordpress" '
            if (!function_exists("toggly_is_enabled")) { throw new RuntimeException("Toggly plugin did not initialize."); }
            if (toggly_is_enabled("missing-feature") !== false) { throw new RuntimeException("Unexpected evaluation result."); }
            if (!wp_next_scheduled("toggly_refresh_features")) { throw new RuntimeException("Refresh cron was not scheduled."); }
            if (!wp_next_scheduled("toggly_send_stats")) { throw new RuntimeException("Telemetry cron was not scheduled."); }
            echo "Toggly WordPress plugin activation passed.\\n";
          '

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      scan_mode: ${{ steps.sonar-eligibility.outputs.scan }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: php-coverage
          path: coverage/

      - name: Require coverage and test reports
        run: |
          test -s coverage/coverage.xml
          test -s coverage/test-results.xml

      - name: Normalize paths in test results
        run: |
          if [ -f "coverage/test-results.xml" ]; then
            sed -i "s|${GITHUB_WORKSPACE}/||g" coverage/test-results.xml
            echo "Paths normalized in test-results.xml"
          else
            echo "::error::PHPUnit test results are required for Sonar analysis." >&2
            exit 1
          fi

      # Pull requests from forks do not receive repository secrets. Do not
      # expose credentials through pull_request_target; record the deliberate
      # skip instead. Trusted pushes and same-repository PRs must scan.
      - name: Determine whether credentialed scans may run
        id: sonar-eligibility
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "Sonar scans are skipped for forked pull requests because repository secrets are unavailable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Sonar credentials for trusted analysis
        if: steps.sonar-eligibility.outputs.scan == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          missing_credentials=""
          [ -n "$SONAR_TOKEN" ] || missing_credentials="SONAR_TOKEN"
          [ -n "$SONAR_SERVER_TOKEN" ] || missing_credentials="${missing_credentials:+$missing_credentials, }SONAR_SERVER_TOKEN"
          [ -n "$SONAR_HOST_URL" ] || missing_credentials="${missing_credentials:+$missing_credentials, }SONAR_HOST_URL"
          if [ -n "$missing_credentials" ]; then
            echo "::error::Required Sonar credentials are unavailable: $missing_credentials." >&2
            exit 1
          fi

      - name: Read SDK version
        id: sdk-version
        if: steps.sonar-eligibility.outputs.scan == 'true'
        run: |
          set -euo pipefail
          version=$(jq -r '.version // empty' composer.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Root composer.json version is required for Sonar analysis." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan and Quality Gate
        if: steps.sonar-eligibility.outputs.scan == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-php
            -Dsonar.organization=ops-ai
            -Dsonar.projectVersion=${{ steps.sdk-version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - PHP"
            -Dsonar.sources=src,packages
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/vendor/**,**/Telemetry/Pb/**,**/GPBMetadata/**
            -Dsonar.php.coverage.reportPaths=coverage/coverage.xml
            -Dsonar.php.tests.reportPath=coverage/test-results.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: SonarQube Server Scan and Quality Gate
        if: steps.sonar-eligibility.outputs.scan == 'true'
        id: sonarqube-server
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-php
            -Dsonar.projectVersion=${{ steps.sdk-version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - PHP"
            -Dsonar.sources=src,packages
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/vendor/**,**/Telemetry/Pb/**,**/GPBMetadata/**
            -Dsonar.php.coverage.reportPaths=coverage/coverage.xml
            -Dsonar.php.tests.reportPath=coverage/test-results.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Report SonarQube Server quality gate
        if: ${{ failure() && steps.sonar-eligibility.outputs.scan == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          host="${SONAR_HOST_URL%/}"
          echo "## SonarQube Server quality gate (toggly-sdks-php)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            status_url="${host}/api/qualitygates/project_status?projectKey=toggly-sdks-php&pullRequest=${pr}"
            issues_url="${host}/api/issues/search?componentKeys=toggly-sdks-php&pullRequest=${pr}&resolved=false&ps=20&s=SEVERITY&asc=false"
          else
            status_url="${host}/api/qualitygates/project_status?projectKey=toggly-sdks-php&branch=${GITHUB_REF_NAME}"
            issues_url="${host}/api/issues/search?componentKeys=toggly-sdks-php&branch=${GITHUB_REF_NAME}&resolved=false&ps=20&s=SEVERITY&asc=false"
          fi
          echo "GET ${status_url}"
          # Community Build may reject -u basic auth for web APIs; try Bearer first.
          if ! curl -sS -H "Accept: application/json" -H "Authorization: Bearer ${SONAR_TOKEN}" "$status_url" -o /tmp/sonar-qg.json -w "%{http_code}" | tee /tmp/sonar-qg.http | grep -q '^200$'; then
            curl -sS -H "Accept: application/json" -u "${SONAR_TOKEN}:" "$status_url" -o /tmp/sonar-qg.json || true
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("/tmp/sonar-qg.json").read_text()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("Could not parse quality-gate API response (non-JSON).")
              print(raw[:500])
              raise SystemExit(0)
          status = data.get("projectStatus", {})
          lines = [
              f"**Status:** `{status.get('status')}`",
              "",
              "| Metric | Status | Actual | Threshold |",
              "|---|---|---|---|",
          ]
          for condition in status.get("conditions", []):
              metric = condition.get("metricKey")
              cond_status = condition.get("status")
              actual = condition.get("actualValue")
              threshold = condition.get("errorThreshold")
              lines.append(f"| `{metric}` | {cond_status} | {actual} | {threshold} |")
              print(f"QG {metric} {cond_status} actual={actual} threshold={threshold}", flush=True)
          Path("/tmp/sonar-qg-summary.md").write_text("\n".join(lines) + "\n")
          PY
          cat /tmp/sonar-qg-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo
          echo "Open issues:"
          curl -sS -H "Accept: application/json" -H "Authorization: Bearer ${SONAR_TOKEN}" "$issues_url" \
            | python3 -c 'import json,sys; raw=sys.stdin.read();
          try: d=json.loads(raw)
          except Exception: print(raw[:300]); raise SystemExit(0)
          print("total", d.get("total"));
          [print(i.get("rule"), i.get("severity"), i.get("component","").split(":")[-1], i.get("line"), (i.get("message") or "")[:120]) for i in d.get("issues",[])]' || true
          # Reporting must not mask the failed scan step.
          exit 0

  dependency-check:
    name: OWASP Dependency Check
    needs: [commits-since-last-run]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.commits-since-last-run.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-php'
          path: '.'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-php
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [commits-since-last-run, test, smoke-test, laravel-hosts, wordpress-host, sonar, dependency-check]
    if: always()

    steps:
      - name: Generate summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SHOULD_RUN: ${{ needs.commits-since-last-run.outputs.should_run }}
          CHECK_RESULT: ${{ needs.commits-since-last-run.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SONAR_SCAN_MODE: ${{ needs.sonar.outputs.scan_mode }}
        run: |
          echo "## PHP SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SHOULD_RUN" != "true" ]; then
            if [ "$CHECK_RESULT" != "success" ]; then
              echo "::error::Could not determine whether main has commits since the last run (check result: $CHECK_RESULT)." >&2
              exit 1
            fi
            echo "Skipped analysis. main has no commits since the last run." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$SONAR_RESULT" != "success" ]; then
            echo "::error::Sonar analysis did not complete successfully (result: $SONAR_RESULT)." >&2
            exit 1
          elif [ "$SONAR_SCAN_MODE" = "true" ]; then
            echo "SonarCloud and SonarQube Server scans completed with quality-gate waits." >> $GITHUB_STEP_SUMMARY
          elif [ "$SONAR_SCAN_MODE" = "false" ]; then
            echo "Sonar scans were skipped for a forked pull request; no credentialed gate was run." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Sonar scan mode was not recorded." >&2
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PHP Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.2" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.3" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.4" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current framework hosts" >> $GITHUB_STEP_SUMMARY
          echo "- Laravel 10.3.3, 11.6.1, 12.12.2, and 13.10.1 from packed artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- WordPress 7.1 plugin activation from a packed artifact on PHP 8.5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Tested" >> $GITHUB_STEP_SUMMARY
          echo "- toggly/feature-management-php (core at repo root)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly/laravel (packages/laravel → mirror)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly/wordpress (packages/wordpress → mirror)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-php" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-php" >> $GITHUB_STEP_SUMMARY
